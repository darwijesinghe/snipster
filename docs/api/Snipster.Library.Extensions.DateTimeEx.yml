- code: public static string ToTimeAgo(this DateTime date)
- h4: Parameters
- parameters:
  - name: date
    type:
    - text: DateTime
      url: https://learn.microsoft.com/dotnet/api/system.datetime
    description: The date to convert to a "time ago" string.
- h4: Returns
- parameters:
  - type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: >-
      A string representing how long ago the date was from now (e.g. "3 hours ago"). If the date is DateTime.MinValue or DateTime.MaxValue, returns "never". 

      If the date is in the future, returns "in the future"; otherwise, returns empty string.
