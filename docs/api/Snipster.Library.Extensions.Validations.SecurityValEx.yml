- api3: IsStrongPassword(string, int)
  id: Snipster_Library_Extensions_Validations_SecurityValEx_IsStrongPassword_System_String_System_Int32_
  src: https://github.com/darwijesinghe/snipster/blob/dev/Snipster.Library/Extensions/Validations/SecurityValEx.cs#L67
  metadata:
    uid: Snipster.Library.Extensions.Validations.SecurityValEx.IsStrongPassword(System.String,System.Int32)
    commentId: M:Snipster.Library.Extensions.Validations.SecurityValEx.IsStrongPassword(System.String,System.Int32)
- markdown: >-
    Determines whether the specified password is considered strong based on length,

    character variety, and Unicode support.
- code: public static bool IsStrongPassword(this string input, int minLength = 8)
- h4: Parameters
- parameters:
  - name: input
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: The input string to validate.
  - name: minLength
    type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
    description: The minimum number of characters required for a valid password. Defaults to <code>8</code>.
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the password is strong; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
- h4: Remarks
- markdown: >-
    A strong password must be at least the specified minimum length and include:<br />

    <ul><li>Letters (uppercase and lowercase, or any Unicode letters).</li><li>At least one digit.</li><li>At least one symbol or punctuation character.</li></ul>
- api3: IsValidEmail(string, bool)
  id: Snipster_Library_Extensions_Validations_SecurityValEx_IsValidEmail_System_String_System_Boolean_
  src: https://github.com/darwijesinghe/snipster/blob/dev/Snipster.Library/Extensions/Validations/SecurityValEx.cs#L23
  metadata:
    uid: Snipster.Library.Extensions.Validations.SecurityValEx.IsValidEmail(System.String,System.Boolean)
    commentId: M:Snipster.Library.Extensions.Validations.SecurityValEx.IsValidEmail(System.String,System.Boolean)
- markdown: >-
    Validates whether the given string is a properly formatted email address.

    Supports both ASCII and Unicode (internationalized) formats based on the <code class="paramref">allowUnicode</code> flag.

    Uses <xref href="System.Net.Mail.MailAddress" data-throw-if-not-resolved="false"></xref> for RFC-compliant parsing.
- code: public static bool IsValidEmail(this string email, bool allowUnicode = false)
- h4: Parameters
- parameters:
  - name: email
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: The email address string to validate.
  - name: allowUnicode
    type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, allows Unicode letters and digits (for IDN and internationalized emails). If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>, restricts to ASCII only.
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the email address is valid; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
