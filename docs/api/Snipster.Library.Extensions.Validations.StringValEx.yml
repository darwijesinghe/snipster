    commentId: M:Snipster.Library.Extensions.Validations.StringValEx.IsAlphabetic(System.String)
- markdown: >-
    Determines whether the string contains only English alphabetic characters (A–Z, a–z). Does not allow 

    spaces, accents (é, ü), or Unicode letters.
- code: public static bool IsAlphabetic(this string input)
- h4: Parameters
- parameters:
  - name: input
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: The string to validate.
- h4: Returns
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the string contains only English letters (A–Z, a–z); otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
