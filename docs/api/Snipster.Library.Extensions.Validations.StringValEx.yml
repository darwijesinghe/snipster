- api3: IsAlphabetic(string)
  id: Snipster_Library_Extensions_Validations_StringValEx_IsAlphabetic_System_String_
  src: https://github.com/darwijesinghe/snipster/blob/dev/Snipster.Library/Extensions/Validations/StringValEx.cs#L95
  metadata:
