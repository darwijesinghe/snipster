- api3: IsValidPhoneNumber(string, string?, out string?)
  id: Snipster_Library_Extensions_Validations_StringValEx_IsValidPhoneNumber_System_String_System_String_System_String__
  src: https://github.com/darwijesinghe/snipster/blob/dev/Snipster.Library/Extensions/Validations/StringValEx.cs#L47
  metadata:
    uid: Snipster.Library.Extensions.Validations.StringValEx.IsValidPhoneNumber(System.String,System.String,System.String@)
    commentId: M:Snipster.Library.Extensions.Validations.StringValEx.IsValidPhoneNumber(System.String,System.String,System.String@)
- markdown: >-
    Validates a phone number and returns it in E.164 format. Accepts common user input and applies 

    region-specific rules when needed.
- code: public static bool IsValidPhoneNumber(this string input, string? region, out string? formattedNumber)
- h4: Parameters
- parameters:
  - name: input
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: Raw phone number provided by the user. (e.g. "+94 70 229 3007", "0702293007").
  - name: region
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    - '?'
    description: ISO country code required for numbers without a leading + prefix.
  - name: formattedNumber
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    - '?'
    description: When valid, contains the normalized E.164 phone number; otherwise, null.
- h4: Returns
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the phone number is valid; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
