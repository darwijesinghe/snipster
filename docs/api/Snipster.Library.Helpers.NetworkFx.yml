- markdown: >-
    Checks if the system has an active internet connection by sending a lightweight request

    to a reliable host (default: https://www.google.com).
- code: public static Task<bool> HasInternetConnectionAsync(string testUrl = "http://www.google.com", int timeoutSeconds = 5)
- h4: Parameters
- parameters:
  - name: testUrl
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
    description: 'Optional test URL (default: https://www.google.com)'
    optional: true
  - name: timeoutSeconds
    type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
    description: 'Timeout in seconds (default: 5)'
    optional: true
- h4: Returns
- parameters:
  - type:
    - text: Task
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.task-1
    - <
    - text: bool
