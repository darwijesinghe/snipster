- markdown: >-
    Defines the contract for the Unit of Work pattern, which coordinates changes across multiple repositories

    and manages database transactions.

    <p><b>Warning:</b> Do not implement this interface yourself. 

    It uses the default <xref href="Snipster.Library.Repository.IGenericRepository%601" data-throw-if-not-resolved="false"></xref> provided by this package.

    Use the provided implementation from the package instead.</p>

    <p><b>Note:</b> You may implement your own <xref href="Snipster.Library.Repository.IGenericRepository%601" data-throw-if-not-resolved="false"></xref> if you want custom repository behavior.

    The <xref href="Snipster.Library.UOW.UnitOfWork" data-throw-if-not-resolved="false"></xref> can work with your custom repository implementation as long as it implements <xref href="Snipster.Library.Repository.IGenericRepository%601" data-throw-if-not-resolved="false"></xref>.</p>
